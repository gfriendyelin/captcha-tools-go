name: Update GeeTest config

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Refresh the V4 patrol config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract config
        id: extract
        run: node scripts/extract-config.mjs

      - name: Commit changes
        id: commit
        if: steps.extract.outputs.CHANGED == 'true'
        env:
          VERSIONS: ${{ steps.extract.outputs.GEETEST_VER }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/v4/resources
          git commit -m "chore: refresh geetest config ${VERSIONS}"
          git push

      # A push made with GITHUB_TOKEN does not start other workflows, so request the
      # image build explicitly: the config is embedded with go:embed, and a refreshed
      # entry is useless until the service ships it.
      - name: Rebuild the image
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker.yml --ref main -f push_image=true
