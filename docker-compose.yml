services:
  captcha-tools-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: captcha-tools-go:local
    container_name: captcha-tools-go
    init: true
    restart: unless-stopped
    ports:
      - "19645:9645"
    environment:
      MODE: "all"
      WORKER_IDLE_TIMEOUT: "1m"
      WORKER_START_TIMEOUT: "2m"
      WORKER_REQUEST_TIMEOUT: "3m"
      WORK_DIR: "/app/img_2_val"
      SAVE_DIR: "/app/img_saved"
      LOG_LEVEL: "INFO"
      use_pdl: "1"
      use_dfine: "1"
      use_multi: "1"
      use_grid: "1"
      DINO_RANDOM_OFFSET: "1"
    volumes:
      - captcha-go-saved:/app/img_saved
      - captcha-go-logs:/app/logs
    tmpfs:
      - /app/img_2_val:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true

volumes:
  captcha-go-saved:
  captcha-go-logs:
